name: Recover production web credential v2

on:
  workflow_dispatch:
    inputs:
      validation_run_id:
        description: Successful Validate production web credential input run ID from this exact main SHA
        required: true
        type: string
      secret_unchanged_confirmation:
        description: Enter recovery-v2-secret-unchanged-confirmed without editing the validated v2 secret
        required: true
        type: string
      recovery_confirmation:
        description: Enter web-credential-recovery-v2-confirmed after validation succeeds
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  one-shot-guard:
    name: Require first recovery v2 dispatch and validated input evidence
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject non-main dispatch, repeat dispatch, rerun, or invalid input
        shell: bash
        env:
          RECOVERY_V2_CONFIRMATION: ${{ inputs.recovery_confirmation }}
          SECRET_UNCHANGED_CONFIRMATION: ${{ inputs.secret_unchanged_confirmation }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$RECOVERY_V2_CONFIRMATION" = "web-credential-recovery-v2-confirmed"
          test "$SECRET_UNCHANGED_CONFIRMATION" = "recovery-v2-secret-unchanged-confirmed"
          case "$VALIDATION_RUN_ID" in
            ''|*[!0-9]*) exit 1 ;;
          esac
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - name: Fetch exact validation run metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID" \
            -o "$RUNNER_TEMP/recovery-v2-validation-run.json"
      - name: Verify validation run before Environment access
        run: node .github/scripts/verify-recovery-v2-validation-run.mjs
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VALIDATION_RUN_JSON_PATH: ${{ runner.temp }}/recovery-v2-validation-run.json

  recover:
    name: Recover production web credential v2
    needs: one-shot-guard
    if: github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recover exact web runtime credential v2
        run: node .github/scripts/recover-production-web-credential-v2.mjs
        env:
          RECOVERY_V2_CONFIRMATION: ${{ inputs.recovery_confirmation }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          NEON_OWNER_DATABASE_URL: ${{ secrets.NEON_OWNER_DATABASE_URL }}
          WEB_RUNTIME_DATABASE_ROLE: ${{ vars.WEB_RUNTIME_DATABASE_ROLE }}
          WEB_RUNTIME_DATABASE_PASSWORD_RECOVERY_V2: ${{ secrets.WEB_RUNTIME_DATABASE_PASSWORD_RECOVERY_V2 }}
