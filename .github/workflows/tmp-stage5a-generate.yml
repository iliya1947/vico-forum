name: Temporary Stage 5A migration generation

on:
  push:
    branches:
      - feat/stage-5a-translation-publication-foundation

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(stage-5a): generate translation completion migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/stage-5a-translation-publication-foundation
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch task completion schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('db/schema.ts')
          text = path.read_text()
          text = text.replace(
              '    staleAt: timestamp("stale_at", { withTimezone: true }),\n    createdAt:',
              '    staleAt: timestamp("stale_at", { withTimezone: true }),\n    completedAt: timestamp("completed_at", { withTimezone: true }),\n    createdAt:',
          )
          text = text.replace(
              "check(\"translation_tasks_status_check\", sql`${table.status} in ('pending', 'processing', 'stale')`)",
              "check(\"translation_tasks_status_check\", sql`${table.status} in ('pending', 'processing', 'stale', 'completed')`)",
          )
          old = '''      sql`(\n        ${table.status} = 'pending'\n        and ${table.claimToken} is null and ${table.claimedAt} is null\n        and ${table.leaseExpiresAt} is null and ${table.staleAt} is null\n      ) or (\n        ${table.status} = 'processing'\n        and ${table.claimToken} is not null and ${table.claimedAt} is not null\n        and ${table.leaseExpiresAt} is not null and ${table.leaseExpiresAt} > ${table.claimedAt}\n        and ${table.staleAt} is null\n      ) or (\n        ${table.status} = 'stale'\n        and ${table.claimToken} is null and ${table.claimedAt} is not null\n        and ${table.leaseExpiresAt} is null and ${table.staleAt} is not null\n        and ${table.staleAt} >= ${table.claimedAt}\n      )`,'''
          new = '''      sql`(\n        ${table.status} = 'pending'\n        and ${table.claimToken} is null and ${table.claimedAt} is null\n        and ${table.leaseExpiresAt} is null and ${table.staleAt} is null and ${table.completedAt} is null\n      ) or (\n        ${table.status} = 'processing'\n        and ${table.claimToken} is not null and ${table.claimedAt} is not null\n        and ${table.leaseExpiresAt} is not null and ${table.leaseExpiresAt} > ${table.claimedAt}\n        and ${table.staleAt} is null and ${table.completedAt} is null\n      ) or (\n        ${table.status} = 'stale'\n        and ${table.claimToken} is null and ${table.claimedAt} is not null\n        and ${table.leaseExpiresAt} is null and ${table.staleAt} is not null\n        and ${table.staleAt} >= ${table.claimedAt} and ${table.completedAt} is null\n      ) or (\n        ${table.status} = 'completed'\n        and ${table.claimToken} is null and ${table.claimedAt} is not null\n        and ${table.leaseExpiresAt} is null and ${table.staleAt} is null\n        and ${table.completedAt} is not null and ${table.completedAt} >= ${table.claimedAt}\n      )`,'''
          if old not in text:
              raise SystemExit('translation task lifecycle block not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY
      - run: pnpm exec drizzle-kit generate --name translation_task_completion
      - name: Commit generated schema history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add db/schema.ts drizzle/
          git commit -m "chore(stage-5a): generate translation completion migration"
          git push origin HEAD:feat/stage-5a-translation-publication-foundation
