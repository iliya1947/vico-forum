name: Manual PR test controls

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-pr-test-controls.yml"
  pull_request:
    types:
      - labeled
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ensure-labels:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure agent test-control labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create "run:ci" --repo "$GH_REPO" --color "0E8A16" --description "Agent-triggered main CI" --force
          gh label create "run:acceptance" --repo "$GH_REPO" --color "5319E7" --description "Agent-triggered relevant acceptance checks" --force

  consume-label:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.label.name == 'run:ci' || github.event.label.name == 'run:acceptance')
    runs-on: ubuntu-latest
    steps:
      - name: Remove consumed test-control label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_LABEL: ${{ github.event.label.name }}
        run: gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$TEST_LABEL"
