name: Validate production web credential input

on:
  workflow_dispatch:
    inputs:
      validation_confirmation:
        description: Enter web-credential-input-validation-confirmed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  input-guard:
    name: Require main validation dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject non-main or wrong confirmation
        shell: bash
        env:
          INPUT_VALIDATION_CONFIRMATION: ${{ inputs.validation_confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$INPUT_VALIDATION_CONFIRMATION" = "web-credential-input-validation-confirmed"

  validate:
    name: Validate production web credential input
    needs: input-guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate exact recovery v2 input and DB preflight
        run: node .github/scripts/validate-production-web-credential-input.mjs
        env:
          INPUT_VALIDATION_CONFIRMATION: ${{ inputs.validation_confirmation }}
          NEON_OWNER_DATABASE_URL: ${{ secrets.NEON_OWNER_DATABASE_URL }}
          WEB_RUNTIME_DATABASE_ROLE: ${{ vars.WEB_RUNTIME_DATABASE_ROLE }}
          WEB_RUNTIME_DATABASE_PASSWORD_RECOVERY_V2: ${{ secrets.WEB_RUNTIME_DATABASE_PASSWORD_RECOVERY_V2 }}
