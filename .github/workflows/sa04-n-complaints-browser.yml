name: SA04-N connected Complaints Worker Chromium AccountState acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/sa04-n-complaints-browser.yml"
      - "tests/browser/sa04-complaints/**"
      - "db/complaints-repository.ts"
      - "db/hyperdrive-complaints.ts"
      - "db/hyperdrive-complaint-queue.ts"
      - "db/hyperdrive-complaint-appeal.ts"
      - "db/hyperdrive-complaint-review.ts"
      - "db/account-state.ts"
      - "db/complaints-service.ts"
      - "app/complaints/**"
      - "app/routes/complaint-*.ts"
      - "app/routes/complaint-*.tsx"
      - "app/routes/attention.tsx"
      - "workers/app.ts"
      - "workers/private-failure-response.ts"

permissions:
  contents: read

jobs:
  complaints_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vico_sa04_n_browser_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vico_sa04_n_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa04_n_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa04_n_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_WEB_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa04_n_browser_test
      IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha }}
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate SA04-N disposable PostgreSQL 17
        run: |
          node --input-type=module -e '
            import pg from "pg";
            import {drizzle} from "drizzle-orm/node-postgres";
            import {migrate} from "drizzle-orm/node-postgres/migrator";
            const c=new pg.Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            try {await migrate(drizzle(c), {migrationsFolder:"./drizzle"});}
            finally {await c.end();}
          '
      - name: Install pinned Playwright
        run: |
          python3 -m venv "$RUNNER_TEMP/sa04-n-playwright"
          "$RUNNER_TEMP/sa04-n-playwright/bin/pip" install playwright==1.62.0
      - name: Build real Worker with disposable Better Auth credentials
        run: |
          umask 077
          printf '%s\n' \
            'BETTER_AUTH_SECRET=sa04-n-browser-only-secret-0123456789abcdef0123456789abcdef' \
            'BETTER_AUTH_URL=http://127.0.0.1:4224' \
            'GOOGLE_CLIENT_ID=local-test-unused' \
            'GOOGLE_CLIENT_SECRET=local-test-unused' \
            > .dev.vars
          pnpm build
      - name: Real Complaint eight-command late-401, storage-503, unknown-500 and Chromium acceptance
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4224 --strictPort > "$RUNNER_TEMP/sa04-n-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:4224/he/ > /dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/sa04-n-preview.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 100 "$RUNNER_TEMP/sa04-n-preview.log"
            exit 1
          fi
          "$RUNNER_TEMP/sa04-n-playwright/bin/python" tests/browser/sa04-complaints/check.py \
            --url http://127.0.0.1:4224 --output "$RUNNER_TEMP/sa04-n-evidence" || {
              tail -n 120 "$RUNNER_TEMP/sa04-n-preview.log"
              exit 1
            }
      - name: Preserve synthetic connected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sa04-n-worker-pg17-chromium-evidence
          path: ${{ runner.temp }}/sa04-n-evidence/
          if-no-files-found: warn
          retention-days: 7
