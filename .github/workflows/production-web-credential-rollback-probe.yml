name: Probe production web credential rollback

on:
  workflow_dispatch:
    inputs:
      diagnostic_confirmation:
        description: Enter web-credential-rollback-probe-confirmed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  one-shot-guard:
    name: Require first rollback-probe dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Reject non-main dispatch, repeat dispatch, or rerun
        shell: bash
        env:
          DIAGNOSTIC_CONFIRMATION: ${{ inputs.diagnostic_confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_RUN_NUMBER" = "1"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$DIAGNOSTIC_CONFIRMATION" = "web-credential-rollback-probe-confirmed"

  probe:
    name: Probe production web credential rollback
    needs: one-shot-guard
    if: github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run rollback-only SCRAM lease diagnostic
        run: node .github/scripts/diagnose-production-web-credential.mjs
        env:
          DIAGNOSTIC_MODE: rollback-probe
          DIAGNOSTIC_CONFIRMATION: ${{ inputs.diagnostic_confirmation }}
          NEON_OWNER_DATABASE_URL: ${{ secrets.NEON_OWNER_DATABASE_URL }}
          WEB_RUNTIME_DATABASE_ROLE: ${{ vars.WEB_RUNTIME_DATABASE_ROLE }}
          WEB_RUNTIME_DATABASE_PASSWORD_BOOTSTRAP: ${{ secrets.WEB_RUNTIME_DATABASE_PASSWORD_BOOTSTRAP }}
