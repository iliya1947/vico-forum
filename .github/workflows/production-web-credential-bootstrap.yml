name: Bootstrap production web credential

on:
  workflow_dispatch:
    inputs:
      bootstrap_confirmation:
        description: Enter web-credential-bootstrap-confirmed after the temporary bootstrap secret is configured
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap production web credential
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: \${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bootstrap exact web runtime credential
        run: node .github/scripts/bootstrap-production-web-credential.mjs
        env:
          BOOTSTRAP_CONFIRMATION: \${{ inputs.bootstrap_confirmation }}
          NEON_OWNER_DATABASE_URL: \${{ secrets.NEON_OWNER_DATABASE_URL }}
          WEB_RUNTIME_DATABASE_ROLE: \${{ vars.WEB_RUNTIME_DATABASE_ROLE }}
          WEB_RUNTIME_DATABASE_PASSWORD_BOOTSTRAP: \${{ secrets.WEB_RUNTIME_DATABASE_PASSWORD_BOOTSTRAP }}
