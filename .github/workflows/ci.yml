name: CI

on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose exact head should be tested
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run:ci'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dispatched PR context
        if: github.event_name == 'workflow_dispatch'
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [ "$state" != "open" ] || [ -z "$head_sha" ] || [ "$head_sha" = "null" ] || [ -z "$base_ref" ] || [ "$base_ref" = "null" ]; then
            echo "Could not resolve an open PR context for #$PR_NUMBER" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout pull request event
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Checkout dispatched PR head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ steps.dispatch-pr.outputs.head_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Protect accepted migration history
        env:
          GITHUB_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && steps.dispatch-pr.outputs.base_ref || github.base_ref }}
        run: |
          node --test .github/scripts/migration-history.test.mjs
          node --test .github/scripts/production-privileges.test.mjs
          node --test .github/scripts/runtime-privileges.test.mjs
          node --test .github/scripts/production-schema-manifest.test.mjs
          node --test .github/scripts/provision-production-web-relations.test.mjs
          node --test .github/scripts/bootstrap-production-web-credential.test.mjs
          node --test .github/scripts/production-web-credential-bootstrap-workflow.test.mjs
          node --test .github/scripts/diagnose-production-web-credential.test.mjs
          node --test .github/scripts/production-web-credential-diagnostic-workflows.test.mjs
          node --test .github/scripts/recover-production-web-credential.test.mjs
          node --test .github/scripts/production-web-credential-recovery-workflow.test.mjs
          node --test .github/scripts/validate-production-web-credential-input.test.mjs
          node --test .github/scripts/verify-recovery-v2-validation-run.test.mjs
          node --test .github/scripts/production-web-credential-recovery-v2-workflows.test.mjs
          node --test .github/scripts/production-worker-rollout.test.mjs
          node --test .github/scripts/production-migration-contract.test.mjs
          node --test .github/scripts/runtime-migration-evidence.test.mjs
          node --test .github/scripts/verify-production-migration-identity.test.mjs
          node .github/scripts/verify-migration-history.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Build UI preview
        run: pnpm ui-preview:build
      - name: Validate migration metadata
        run: pnpm db:check
      - name: Verify Drizzle schema parity
        run: |
          pnpm exec drizzle-kit generate --name=ci-schema-parity
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --short -- drizzle
            git diff -- drizzle
            exit 1
          fi
  database:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run:ci'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vico_forum_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vico_forum_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vico_forum_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_forum_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_WEB_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_forum_test
    steps:
      - name: Resolve dispatched PR context
        if: github.event_name == 'workflow_dispatch'
        id: dispatch-pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          pr_json="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          if [ "$state" != "open" ] || [ -z "$head_sha" ] || [ "$head_sha" = "null" ] || [ -z "$base_ref" ] || [ "$base_ref" = "null" ]; then
            echo "Could not resolve an open PR context for #$PR_NUMBER" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
      - name: Checkout pull request event
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Checkout dispatched PR head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.dispatch-pr.outputs.head_sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test clean PostgreSQL 17 migrations and constraints
        run: pnpm db:test
      - name: Verify production schema manifest parity
        run: node .github/scripts/verify-production-schema-manifest.mjs
      - name: Verify runtime privilege probes
        run: node .github/scripts/verify-runtime-privilege-probes.mjs
      - name: Verify split-authority web relation provisioning
        run: node .github/scripts/verify-web-relation-provisioning-probes.mjs
      - name: Verify web credential diagnostics and rollback-only probe
        run: node .github/scripts/verify-web-credential-diagnostic-probes.mjs
      - name: Verify web credential recovery and compensation
        run: node .github/scripts/verify-web-credential-recovery-probes.mjs
      - name: Verify web credential bootstrap and compensation
        run: node .github/scripts/verify-web-credential-bootstrap-probes.mjs
      - name: Build for Workers smoke
        run: pnpm build
      - name: Workers smoke with split local Hyperdrive overrides
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4173 > /tmp/vico-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ./scripts/smoke-workers.sh http://127.0.0.1:4173
      - name: Worker Better Auth Complaints local HTTP smoke
        run: |
          node --test scripts/smoke-complaints-ownership.probe.mjs
          pnpm exec tsx scripts/smoke-complaints-local.ts
          test ! -e .dev.vars && test ! -L .dev.vars
      - name: SA04-J12 built Worker Better Auth AccountState late-deactivation smoke
        run: |
          pnpm exec tsx scripts/smoke-forum-accountstate-local.ts
          test ! -e .dev.vars && test ! -L .dev.vars
      - name: SA05-2 built Worker protected Owner resource and alias smoke
        run: |
          pnpm exec tsx scripts/smoke-owner-deactivation-local.ts
          test ! -e .dev.vars && test ! -L .dev.vars
