name: Personal Mute/Block connected acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/personal-filters-browser.yml"
      - "tests/browser/personal-filters/**"
      - "app/forum/**"
      - "app/routes/topic.tsx"
      - "app/routes/profile.tsx"
      - "app/routes/filters.tsx"
      - "db/personal-notification-policy.ts"
      - "app/authorization/catalog.ts"
      - "app/localization/**"
      - "app/styles.css"
      - "db/forum-*.ts"
      - "db/hyperdrive-forum.ts"
      - "db/schema.ts"
      - "drizzle/**"

permissions:
  contents: read

jobs:
  personal_filters_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vico_filters_browser_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vico_filters_browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vico_filters_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_filters_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_WEB_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_filters_browser_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable database and browser
        run: |
          node --input-type=module -e '
            import pg from "pg";
            import {drizzle} from "drizzle-orm/node-postgres";
            import {migrate} from "drizzle-orm/node-postgres/migrator";
            const c=new pg.Client({connectionString:process.env.DATABASE_URL});
            await c.connect();
            try {await migrate(drizzle(c),{migrationsFolder:"./drizzle"});}
            finally {await c.end();}
          '
          python3 -m venv "$RUNNER_TEMP/filters-playwright"
          "$RUNNER_TEMP/filters-playwright/bin/pip" install playwright==1.62.0
      - name: Build and verify the actual Worker
        run: |
          umask 077
          printf '%s\n' \
            'BETTER_AUTH_SECRET=filters-local-acceptance-only-0123456789abcdef0123456789abcdef' \
            'BETTER_AUTH_URL=http://127.0.0.1:4242' \
            'GOOGLE_CLIENT_ID=local-test-unused' \
            'GOOGLE_CLIENT_SECRET=local-test-unused' > .dev.vars
          pnpm build
          pnpm exec vite preview --host 127.0.0.1 --port 4242 --strictPort > "$RUNNER_TEMP/filters-worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:4242/en/ > /dev/null; then ready=true; break; fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then tail -n 80 "$RUNNER_TEMP/filters-worker.log"; exit 1; fi
          "$RUNNER_TEMP/filters-playwright/bin/python" tests/browser/personal-filters/check.py \
            --output "$RUNNER_TEMP/filters-evidence" || {
              tail -n 80 "$RUNNER_TEMP/filters-worker.log"
              exit 1
            }
      - name: Preserve connected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: personal-filters-connected
          path: ${{ runner.temp }}/filters-evidence/
          retention-days: 7
          if-no-files-found: warn
