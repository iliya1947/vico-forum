name: Provision production web relation grants

on:
  workflow_dispatch:
    inputs:
      owner_phase_confirmation:
        description: Enter owner-phase-password-null-confirmed after reviewed owner phase created the web role with PASSWORD NULL
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-db-migrations
  cancel-in-progress: false

jobs:
  provision:
    name: Provision production web relation grants
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-db
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision exact web relation grants
        run: node .github/scripts/provision-production-web-relations.mjs
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          RUNTIME_DATABASE_ROLE: ${{ vars.RUNTIME_DATABASE_ROLE }}
          WEB_RUNTIME_DATABASE_ROLE: ${{ vars.WEB_RUNTIME_DATABASE_ROLE }}
          OWNER_PHASE_CONFIRMATION: ${{ inputs.owner_phase_confirmation }}
