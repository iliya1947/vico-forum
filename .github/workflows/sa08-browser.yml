name: SA08-A Overview and History connected Chromium acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/sa08-browser.yml"
      - "tests/browser/sa08/**"
      - ".github/scripts/runtime-privileges.*"
      - ".github/scripts/verify-runtime-privilege-probes.mjs"
      - "app/styles.css"
      - "app/observability/integration-runtime*"
      - "app/observability/operational-facts*"
      - "app/observability/storage-observations*"
      - "app/localization/*execution.ts"
      - "app/localization/translation-provider.ts"
      - "app/localization/translation-task-reconciliation.ts"
      - "db/translation-task-store.ts"
      - "db/content-*-store.ts"
      - "db/ui-translation-publication-store.ts"
      - "app/super-admin/**"
      - "app/administrative-routing/**"
      - "app/routes/super-admin*.tsx"
      - "app/routes/super-admin*.ts"
      - "app/auth/**"
      - "app/routes.ts"
      - "app/localization/catalog.ts"
      - "app/localization/manual-values.ts"
      - "app/localization/manual-fingerprints.ts"
      - "db/owner-*.ts"
      - "db/hyperdrive-owner-*.ts"
      - "db/hyperdrive-operational-recording.ts"
      - "db/hyperdrive-forum*.ts"
      - "db/forum-attachments.ts"
      - "db/forum-attachment-cleanup.ts"
      - "db/forum-repository.ts"
      - "db/schema.ts"
      - "workers/app.ts"
      - "workers/attachment-storage.ts"
      - "workers/private-failure-response.ts"

permissions:
  contents: read

jobs:
  sa08_browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vico_sa08_browser_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vico_sa08_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_WEB_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha }}
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate disposable PostgreSQL 17
        run: |
          node --input-type=module -e '
            import pg from "pg";
            import {drizzle} from "drizzle-orm/node-postgres";
            import {migrate} from "drizzle-orm/node-postgres/migrator";
            const client = new pg.Client({connectionString:process.env.DATABASE_URL});
            await client.connect();
            try { await migrate(drizzle(client), {migrationsFolder:"./drizzle"}); }
            finally { await client.end(); }
          '
      - name: Install pinned Python Playwright
        run: |
          python3 -m venv "$RUNNER_TEMP/sa08-playwright"
          "$RUNNER_TEMP/sa08-playwright/bin/pip" install playwright==1.62.0
      - name: Build real Worker with synthetic local Owner
        run: |
          umask 077
          printf '%s\n' \
            'BETTER_AUTH_SECRET=sa08-browser-only-secret-0123456789abcdef0123456789abcdef' \
            'BETTER_AUTH_URL=http://127.0.0.1:4238' \
            'GOOGLE_CLIENT_ID=SA08_I_PRIVATE_GOOGLE_ID' \
            'GOOGLE_CLIENT_SECRET=SA08_I_PRIVATE_GOOGLE_SECRET' \
            'VICO_OWNER_USER_ID=sa08-synthetic-owner' > .dev.vars
          pnpm build
      - name: Real Overview composition, final filters, partial availability and viewer isolation
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4238 --strictPort > "$RUNNER_TEMP/sa08-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true; rm -f .dev.vars' EXIT
          ready=false
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:4238/he/ > /dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
            exit 1
          fi
          "$RUNNER_TEMP/sa08-playwright/bin/python" tests/browser/sa08/check.py \
            --url http://127.0.0.1:4238 --output "$RUNNER_TEMP/sa08-evidence" || {
              tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
              exit 1
            }
      - name: Preserve SA08 synthetic connected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sa08-browser-evidence
          path: ${{ runner.temp }}/sa08-evidence/
          if-no-files-found: warn
          retention-days: 7
