name: SA08 Overview and whole-program entry connected Chromium acceptance

on:
  pull_request:
    types:
      - labeled
    paths:
      - "tests/database/auth-whole-lifecycle.test.ts"
      - ".github/workflows/sa08-browser.yml"
      - "tests/browser/sa08/**"
      - ".github/scripts/runtime-privileges.*"
      - ".github/scripts/verify-runtime-privilege-probes.mjs"
      - "app/styles.css"
      - "app/observability/integration-runtime*"
      - "app/observability/operational-facts*"
      - "app/observability/storage-observations*"
      - "app/localization/*execution.ts"
      - "app/localization/translation-provider.ts"
      - "app/localization/translation-task-reconciliation.ts"
      - "db/translation-task-store.ts"
      - "db/content-*-store.ts"
      - "db/ui-translation-publication-store.ts"
      - "app/super-admin/**"
      - "app/administrative-routing/**"
      - "app/routes/super-admin*.tsx"
      - "app/routes/super-admin*.ts"
      - "app/auth/**"
      - "app/routes.ts"
      - "app/localization/catalog.ts"
      - "app/localization/manual-values.ts"
      - "app/localization/manual-fingerprints.ts"
      - "db/owner-*.ts"
      - "db/hyperdrive-owner-*.ts"
      - "db/hyperdrive-operational-recording.ts"
      - "db/hyperdrive-forum*.ts"
      - "db/forum-attachments.ts"
      - "db/forum-attachment-cleanup.ts"
      - "db/forum-repository.ts"
      - "db/schema.ts"
      - "workers/app.ts"
      - "workers/attachment-storage.ts"
      - "workers/private-failure-response.ts"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sa08_browser:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run:acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vico_sa08_browser_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vico_sa08_browser_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_WEB_HYPERDRIVE: postgresql://postgres:postgres@127.0.0.1:5432/vico_sa08_browser_test
      IMPLEMENTATION_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate disposable PostgreSQL 17
        run: |
          node --input-type=module -e '
            import pg from "pg";
            import {drizzle} from "drizzle-orm/node-postgres";
            import {migrate} from "drizzle-orm/node-postgres/migrator";
            const client = new pg.Client({connectionString:process.env.DATABASE_URL});
            await client.connect();
            try { await migrate(drizzle(client), {migrationsFolder:"./drizzle"}); }
            finally { await client.end(); }
          '
      - name: Install pinned Python Playwright
        run: |
          python3 -m venv "$RUNNER_TEMP/sa08-playwright"
          "$RUNNER_TEMP/sa08-playwright/bin/pip" install playwright==1.62.0
      - name: Build real Worker with synthetic local Owner
        run: |
          umask 077
          printf '%s\n' \
            'BETTER_AUTH_SECRET=sa08-browser-only-secret-0123456789abcdef0123456789abcdef' \
            'BETTER_AUTH_URL=http://127.0.0.1:4238' \
            'GOOGLE_CLIENT_ID=SA08_I_PRIVATE_GOOGLE_ID' \
            'GOOGLE_CLIENT_SECRET=SA08_I_PRIVATE_GOOGLE_SECRET' \
            'VICO_OWNER_USER_ID=sa08-synthetic-owner' > .dev.vars
          pnpm build
      - name: Real whole-program entry, Overview, filters, partial availability and viewer isolation
        run: |
          preview_pid=""
          stop_preview() {
            if [ -n "$preview_pid" ]; then
              kill "$preview_pid" 2>/dev/null || true
              wait "$preview_pid" 2>/dev/null || true
              preview_pid=""
            fi
          }
          trap 'stop_preview; rm -f .dev.vars build/server/.dev.vars' EXIT
          start_preview() {
            node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4238 --strictPort > "$RUNNER_TEMP/sa08-preview.log" 2>&1 &
            preview_pid=$!
            ready=false
            for attempt in $(seq 1 90); do
              if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:4238/he/ > /dev/null 2>&1; then
                ready=true
                break
              fi
              if ! kill -0 "$preview_pid" 2>/dev/null; then break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
              exit 1
            fi
          }
          start_preview
          "$RUNNER_TEMP/sa08-playwright/bin/python" tests/browser/sa08/check.py \
            --url http://127.0.0.1:4238 --output "$RUNNER_TEMP/sa08-evidence" || {
              tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
              exit 1
            }
          stop_preview
          for binding in missing wrong; do
            # Preview reads the build-copied synthetic vars, not the source file.
            # Product Wrangler remains untouched.
            python3 - "$binding" <<'PYVARS'
          import sys
          from pathlib import Path
          p=Path('build/server/.dev.vars')
          lines=[line for line in p.read_text().splitlines() if not line.startswith('VICO_OWNER_USER_ID=')]
          if sys.argv[1]=='wrong':lines.append('VICO_OWNER_USER_ID=sa08-wrong-synthetic-owner')
          p.write_text('\n'.join(lines)+'\n')
          PYVARS
            start_preview
            "$RUNNER_TEMP/sa08-playwright/bin/python" tests/browser/sa08/binding-check.py \
              --url http://127.0.0.1:4238 --mode "$binding" --output "$RUNNER_TEMP/sa08-evidence/binding-$binding" || {
                tail -n 100 "$RUNNER_TEMP/sa08-preview.log"
                exit 1
              }
            stop_preview
          done
      - name: Preserve SA08 synthetic connected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sa08-browser-evidence
          path: ${{ runner.temp }}/sa08-evidence/
          if-no-files-found: warn
          retention-days: 7
